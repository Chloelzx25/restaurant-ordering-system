<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add to Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Restaurant Ordering System</a>
            <div class="d-flex align-items-center">
                <a href="/cart/retrieve/all" class="btn btn-outline-light btn-sm me-2">View Cart</a>
                <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        <a href="/member/products" class="btn btn-outline-secondary btn-sm mb-3">←Back to Products</a>
        <div class="card">
            <div class="card-body">
                <h4 class="fw-bold">Add Cart Items</h4>
                <div id="alert-box" class="alert py-2" style="display:none;"></div>
                <table>
                    <tr>
                        <td class="pe-3">
                            <label class="form-label">Product Id</label>
                            <input type="number" id="product-id" class="form-control form-control-sm" min="1" style="width:100px;">
                        </td>
                        <td class="pe-3">
                            <label class="form-label">Quantity</label>
                            <input type="number" id="quantity" class="form-control form-control-sm" min="1" value="1" style="width:100px;">
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2" class="pt-2">
                            <button class="btn btn-secondary btn-sm" onclick="addToCart()">Add</button>
                        </td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/cart.js"></script>
</body>
</html>
