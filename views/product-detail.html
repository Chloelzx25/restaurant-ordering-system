<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details - Member View</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">Restaurant Ordering System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <span class="navbar-text me-3">Welcome, Member</span>
        <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="container mt-4">

    <div class="mb-3">
      <a href="/member/products" class="btn btn-outline-secondary btn-sm">← Back to Products</a>
    </div>

    <!-- Loading State -->
    <div id="loading" class="text-center py-5">
      <div class="spinner-border text-secondary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Error State -->
    <div id="error-message" class="alert alert-danger" style="display: none;">
      Failed to load product details.
    </div>

    <!-- Product Detail Card -->
    <div id="product-detail" style="display: none;">
      <div class="card">
        <div class="card-body">
          <h4 class="card-title mb-4" id="detail-name"></h4>
          <table class="table table-striped align-middle">
            <tbody>
              <tr><th style="width:200px;">Category</th><td id="detail-category"></td></tr>
              <tr><th>Description</th><td id="detail-description"></td></tr>
              <tr><th>Price</th><td id="detail-price"></td></tr>
              <tr><th>Status</th><td id="detail-status"></td></tr>
              <tr><th>Created At</th><td id="detail-created-at"></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Create Feedback -->
    <div id="create-feedback-section" class="mt-4" style="display:none;"></div>

    <!-- Feedback List -->
    <div id="feedback-section" class="mt-4" style="display:none;"></div>

  </main>

  <!-- Update Feedback Modal -->
  <div class="modal fade" id="updateModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Update Feedback</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div id="update-alert" class="alert py-2" style="display:none;"></div>
          <input type="hidden" id="update-id">
          <div class="mb-3">
            <label class="form-label">Rating</label>
            <select id="update-rating" class="form-select">
              <option value="1">1 ★</option>
              <option value="2">2 ★★</option>
              <option value="3">3 ★★★</option>
              <option value="4">4 ★★★★</option>
              <option value="5">5 ★★★★★</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Comment</label>
            <textarea id="update-comment" class="form-control" rows="3"></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-primary" onclick="submitUpdate()">Update</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/feedback.js"></script>
  <script src="/js/product-detail.js"></script>
</body>
</html>
