<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Feedback</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Restaurant Ordering System</a>
    <div class="d-flex align-items-center">
      <span class="text-white me-3">Welcome, Member</span>
      <a href="/logout" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
  </div>
</nav>

<div class="container mt-4">
  <a href="/member/products" class="btn btn-outline-secondary btn-sm mb-3">← Back to Products</a>

  <div class="card">
    <div class="card-body">
      <h4 class="text-center fw-bold">Retrieve All My Feedback</h4>
      <div id="feedback-list">Loading...</div>
    </div>
  </div>
</div>

<!-- Update Modal -->
<div class="modal fade" id="updateModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Update Feedback</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div id="update-alert" class="alert py-2" style="display:none;"></div>
        <input type="hidden" id="update-id">
        <div class="mb-3">
          <label class="form-label">Rating</label>
          <select id="update-rating" class="form-select">
            <option value="1">1 ★</option>
            <option value="2">2 ★★</option>
            <option value="3">3 ★★★</option>
            <option value="4">4 ★★★★</option>
            <option value="5">5 ★★★★★</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Comment</label>
          <textarea id="update-comment" class="form-control" rows="3"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" onclick="submitUpdate()">Update</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/feedback.js"></script>
</body>
</html>
